<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashwin Philip | Data Professional</title>
<meta name="description" content="Ashwin Philip, Data Professional. A walkable 8-bit overworld portfolio: about, selected work, beyond the data, and contact.">
<meta name="theme-color" content="#0a0816">
<meta property="og:title" content="Ashwin Philip | Data Professional">
<meta property="og:description" content="Walk around the arcade to explore my work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230a0816'/%3E%3Crect x='2' y='1' width='4' height='1' fill='%233df5e0'/%3E%3Crect x='1' y='2' width='6' height='4' fill='%233df5e0'/%3E%3Crect x='2' y='6' width='4' height='1' fill='%233df5e0'/%3E%3Crect x='3' y='3' width='1' height='1' fill='%230a0816'/%3E%3Crect x='5' y='3' width='1' height='1' fill='%230a0816'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: one-screen arcade cabinet. HUD on top, a 3:2 CRT screen in the middle, controls below.
   Panels slide over the whole page when you walk through a door. */
:root{
  --bg:#0a0816;
  --panel:#130f2e;
  --panel2:#1b1642;
  --ink:#ece8ff;
  --muted:#a9a1da;
  --purple:#9b6dff;
  --cyan:#3df5e0;
  --pink:#ff4fa3;
  --gold:#ffd23f;
  --line:#3a3180;
  --f-display:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --f-body:'VT323', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:22px;line-height:1.2;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;overflow:hidden;
}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;font-family:var(--f-display);font-size:10px;letter-spacing:.04em}
.hud .name{color:var(--cyan);text-shadow:0 0 8px rgba(61,245,224,.5)}
.hud .name i{font-style:normal;color:var(--pink)}
.hud .score{color:var(--muted)}
.hud .score b{color:var(--gold);font-weight:400}
.hud .score.done b{text-shadow:0 0 10px var(--gold)}
.tools{display:flex;gap:8px}
.btn{
  font:inherit;font-family:var(--f-display);font-size:9px;letter-spacing:.04em;color:var(--ink);background:var(--panel);
  border:2px solid var(--line);padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 #000;
}
a.btn{display:inline-block;text-decoration:none;line-height:1.2}
.alt{display:flex;justify-content:center;margin-top:6px}
.alt .skip{font-size:9px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn:focus-visible,a:focus-visible,.start:focus-visible,.pb:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}

/* Stage */
.stage{container-type:size;display:grid;place-items:center;min-height:0}
.screen{
  position:relative;container-type:size;width:100%;width:min(100cqw,calc(var(--arn,1.5)*100cqh));aspect-ratio:var(--ar,3/2);background:#0b0920;
  box-shadow:0 0 0 4px #1d1745,0 0 0 6px var(--purple),0 0 36px rgba(155,109,255,.35);
}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.crt{
  position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.2) 2px 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.5) 100%);
}

/* Title screen */
.title{
  position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:3cqh;text-align:center;
  background:rgba(8,6,22,.8);padding:4cqh 4cqw;
}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(14px,5.4cqw,36px);margin:0;color:#fff;
  text-shadow:0 0 6px var(--purple),0 0 18px var(--purple),0 3px 0 #2a1a66;text-wrap:balance}
.title h1 i{font-style:normal;color:var(--pink)}
.title .role{font-family:var(--f-display);font-size:clamp(7px,1.9cqw,12px);color:var(--cyan);letter-spacing:.06em;line-height:1.7}
.title .tag{font-size:clamp(16px,3.6cqw,28px);color:var(--ink);max-width:30ch;text-wrap:balance}
.start{
  font-family:var(--f-display);font-size:clamp(9px,2.3cqw,15px);color:var(--bg);background:var(--gold);border:0;
  padding:1.6cqh 3cqw;cursor:pointer;box-shadow:0 4px 0 #8a6d00,0 0 24px rgba(255,210,63,.4);
}
.start span{animation:pulse 1s steps(1) infinite}
@keyframes pulse{50%{opacity:.2}}
.start:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6d00}
.skip{font-family:var(--f-display);font-size:clamp(7px,1.6cqw,10px);color:var(--muted);background:none;border:0;border-bottom:2px solid var(--line);padding:4px 0;cursor:pointer}
.skip:hover{color:var(--cyan);border-color:var(--cyan)}
@keyframes blink{50%{opacity:0}}

/* Dialogue box */
.dialog{
  position:absolute;left:3%;right:3%;bottom:4%;background:var(--panel);border:3px solid var(--cyan);
  box-shadow:0 0 0 3px #000,0 0 18px rgba(61,245,224,.3);padding:1.6cqh 2.2cqw 2.2cqh;min-height:15cqh;
  font-size:clamp(17px,3.5cqw,28px);line-height:1.15;
}
.dialog .arrow{position:absolute;right:2cqw;bottom:1cqh;width:10px;height:10px;background:var(--cyan);clip-path:polygon(0 0,100% 0,50% 100%);animation:blink .8s steps(1) infinite}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Controls */
.controls{min-height:0}
.hint{margin:0;text-align:center;font-family:var(--f-display);font-size:9px;line-height:1.9;color:var(--muted);letter-spacing:.04em}
.hint b{color:var(--cyan);font-weight:400}
.pad{display:none;align-items:center;justify-content:space-between;gap:16px;user-select:none;-webkit-user-select:none;padding-bottom:4px}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:2px}
.pb{
  width:50px;height:50px;display:grid;place-items:center;background:var(--panel2);color:var(--ink);border:2px solid var(--line);
  box-shadow:0 3px 0 #000;touch-action:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-display);font-size:11px;padding:0;
}
.pb:active,.pb.on{background:var(--purple);color:#fff;transform:translateY(2px);box-shadow:0 1px 0 #000}
.pb svg{width:18px;height:18px;fill:currentColor}
.pb.up{grid-column:2;grid-row:1}.pb.left{grid-column:1;grid-row:2}.pb.right{grid-column:3;grid-row:2}.pb.down{grid-column:2;grid-row:3}
.pb.up svg{transform:rotate(0)}.pb.right svg{transform:rotate(90deg)}.pb.down svg{transform:rotate(180deg)}.pb.left svg{transform:rotate(270deg)}
.ab{display:flex;gap:14px;align-items:center}
.pb.round{width:62px;height:62px;border-radius:50%}
.pb.a{background:var(--pink);border-color:#ff8cc4;color:#1a0212}
.pb.a:active{background:#ff8cc4}
@media (hover:none),(max-width:700px){.pad{display:flex}.hint{display:none}}
/* Touch: bigger tap targets */
@media (hover:none),(max-width:700px){
  .btn{font-size:10px;padding:12px 14px;min-height:44px}
  .alt{margin-top:2px}
  .alt .skip{font-size:10px;padding:10px 4px}
  .pad{padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
  .dpad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
  .pb{width:58px;height:58px}
  .pb.round{width:70px;height:70px}
}
@media (max-width:380px) and (orientation:portrait){
  .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
  .pb{width:52px;height:52px}
  .pb.round{width:62px;height:62px}
  .pad{gap:10px}.ab{gap:10px}
}
/* Landscape phones: D-pad left, screen centre, A/B right */
@media (hover:none) and (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);gap:6px 12px}
  .hud{grid-column:1/-1;flex-wrap:nowrap}
  .btn{min-height:38px;padding:8px 12px}
  .stage{grid-column:2;grid-row:2}
  .controls{display:contents}
  .alt,.hint{display:none}
  .pad{display:contents}
  .dpad{grid-column:1;grid-row:2;align-self:center;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}
  .pb{width:54px;height:54px}
  .ab{grid-column:3;grid-row:2;align-self:center;flex-direction:column-reverse;gap:18px}
  .pb.round{width:66px;height:66px}
}

/* Panels */
.overlay{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,4,14,.86);
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
}
.win{
  width:min(100%,800px);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--purple);
  box-shadow:0 0 0 3px #000,0 0 44px rgba(155,109,255,.35),7px 7px 0 3px #000;animation:pop .22s steps(4);min-height:0;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border-bottom:3px solid var(--purple);font-family:var(--f-display);font-size:11px;color:var(--cyan);letter-spacing:.05em}
.wbody{overflow:auto;padding:20px 20px 24px;font-size:24px;line-height:1.22;overscroll-behavior:contain;display:grid;gap:14px;min-height:0}
.wbody>*{margin:0;min-width:0}
.wbody p{max-width:62ch;color:var(--ink)}
.wbody h2{font-family:var(--f-display);font-weight:400;font-size:clamp(13px,2.6vw,17px);line-height:1.5;color:var(--gold);text-wrap:balance}
.wbody blockquote{border-left:4px solid var(--cyan);padding:4px 0 4px 14px;color:var(--cyan);font-size:28px;max-width:34ch}
.wbody hr{border:0;border-top:3px dashed var(--line);width:100%}
.lead{color:var(--muted)}
.carts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.cart{border:2px solid var(--line);background:var(--bg);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.cart.feat{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,63,.15)}
.cart h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:11px;line-height:1.6;color:var(--ink)}
.badge{justify-self:start;font-family:var(--f-display);font-size:8px;background:var(--gold);color:#1a1200;padding:4px 6px}
.cart .tags{font-family:var(--f-display);font-size:8px;line-height:1.7;color:var(--pink);letter-spacing:.06em;text-transform:uppercase}
.cart p{font-size:21px;line-height:1.18;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:19px;line-height:1.1;border:2px solid var(--line);padding:1px 7px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:2px}
a.lnk,.lnk{
  font-family:var(--f-display);font-size:9px;letter-spacing:.04em;color:var(--cyan);border:2px solid var(--cyan);background:none;
  padding:9px 11px;text-decoration:none;cursor:pointer;display:inline-block;line-height:1.3;
}
a.lnk:hover,.lnk:hover{background:var(--cyan);color:var(--bg)}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.mail code{font-family:var(--f-body);font-size:28px;color:var(--gold);user-select:all;overflow-wrap:anywhere}
.fine{font-size:20px;color:var(--muted)}

.resume{display:block;width:100%;max-width:760px;height:auto;justify-self:center;background:#fff;border:2px solid var(--line)}
/* Abilities Unlocked tree */
.win.wide{width:min(100%,1080px)}
.tree{display:grid;justify-items:stretch}
.thead{display:flex;justify-content:center;margin-bottom:16px}
.tcount{font-family:var(--f-display);font-size:clamp(24px,5vw,36px);color:var(--gold);text-shadow:0 0 16px rgba(255,210,63,.5)}
.tcount small{font-size:.5em;color:var(--muted);text-shadow:none}
.rootwrap{display:grid;justify-items:center}
.rootwrap::after{content:"";width:2px;height:20px;background:var(--line)}
.rootnode{
  display:flex;align-items:center;gap:10px;border:2px solid var(--line);padding:10px 14px;background:var(--bg);
  font-family:var(--f-display);font-size:10px;color:var(--muted);
}
.rootnode.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px rgba(61,245,224,.35);animation:unlock .25s steps(3)}
.branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.branch{position:relative;min-width:0}
.bhead{
  display:flex;align-items:center;gap:8px;border:2px solid var(--line);padding:9px 10px;background:var(--panel2);
  font-family:var(--f-display);font-size:8px;line-height:1.7;color:var(--muted);min-width:0;overflow-wrap:anywhere;
}
.bhead svg{flex:none}
.bhead.on{border-color:var(--c);color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent);animation:unlock .25s steps(3)}
.branch ul{list-style:none;margin:0;padding:12px 0 0;display:grid;gap:12px}
.skill{
  position:relative;display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);padding:7px 9px;background:var(--bg);
  font-size:21px;line-height:1.05;color:var(--muted);min-width:0;overflow-wrap:anywhere;
}
.skill::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:12px;background:var(--line);transform:translateX(-1px)}
.skill .gem{flex:none;width:8px;height:8px;margin-top:5px;background:var(--line)}
.skill.on{border-color:var(--c);color:var(--ink);box-shadow:0 0 10px color-mix(in srgb,var(--c) 30%,transparent);animation:unlock .25s steps(3)}
.skill.on::before{background:var(--c)}
.skill.on .gem{background:var(--c);box-shadow:0 0 6px var(--c)}
@keyframes unlock{0%{transform:scale(1.08);filter:brightness(1.8)}100%{transform:none;filter:none}}
@media (min-width:640px){.branches{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){
  .branches{grid-template-columns:repeat(6,minmax(0,1fr));padding-top:20px}
  .branch::before{content:"";position:absolute;top:-20px;left:50%;width:2px;height:20px;background:var(--line);transform:translateX(-1px)}
  .branch::after{content:"";position:absolute;top:-20px;left:-6px;right:-6px;height:2px;background:var(--line)}
  .branch:first-child::after{left:50%}
  .branch:last-child::after{right:50%}
}
@media (max-width:420px){.branches{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.skill.on,.bhead.on,.rootnode.on{animation:none}}

@media (max-width:520px){
  .wbody{padding:16px 14px 20px;font-size:22px}
  .bar{font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  .start span,.dialog .arrow{animation:none}
  .win{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <span class="name">ASHWIN PHILIP<i>.</i></span>
    <span class="score" id="scoreWrap" aria-live="polite">DATA POINTS <b id="score">0/8</b></span>
    <span class="tools">
      <button class="btn" id="snd" type="button" aria-pressed="false">SOUND ON</button>
      <button class="btn" id="resume" type="button">RESUME</button>
    </span>
  </header>

  <main class="stage">
    <div class="screen" id="screen">
      <canvas id="cv" role="img" aria-label="Pixel overworld map with four buildings: About, the Arcade (selected work), the Cafe (beyond the data) and the Post Office (contact). Use the Plain view button for a text version."></canvas>
      <div class="crt"></div>

      <div class="title" id="title">
        <h1>ASHWIN PHILIP<i>.</i></h1>
        <div class="role">DATA PROFESSIONAL</div>
        <p class="tag" style="margin:0">Breaking down complex data. Building intelligent strategy.</p>
        <button class="start" id="start" type="button"><span>PRESS START</span></button>
        <button class="skip" id="skip" type="button">Skip the game and read the plain version</button>
      </div>

      <div class="dialog" id="dialog" hidden>
        <div id="dtext" aria-hidden="true"></div>
        <div class="sr" id="dsr" role="status"></div>
        <span class="arrow"></span>
      </div>
    </div>
  </main>

  <footer class="controls">
    <p class="hint">MOVE <b>ARROWS / WASD</b> &nbsp; TALK <b>ENTER / SPACE</b> &nbsp; BACK <b>ESC</b></p>
    <div class="alt"><button class="skip" id="plain" type="button">Plain text version</button></div>
    <div class="pad" id="pad">
      <div class="dpad">
        <button class="pb up" data-dir="up" aria-label="Up" type="button"><svg viewBox="0 0 10 10"><path d="M5 1l4 7H1z"/></svg></button>
        <button class="pb left" data-dir="left" aria-label="Left" type="button"><svg viewBox="0 0 10 10"><path d="M5 1l4 7H1z"/></svg></button>
        <button class="pb right" data-dir="right" aria-label="Right" type="button"><svg viewBox="0 0 10 10"><path d="M5 1l4 7H1z"/></svg></button>
        <button class="pb down" data-dir="down" aria-label="Down" type="button"><svg viewBox="0 0 10 10"><path d="M5 1l4 7H1z"/></svg></button>
      </div>
      <div class="ab">
        <button class="pb round" id="bBtn" aria-label="Back" type="button">B</button>
        <button class="pb round a" id="aBtn" aria-label="Action" type="button">A</button>
      </div>
    </div>
  </footer>
</div>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="wtitle">
  <div class="win" id="win">
    <div class="bar"><span id="wtitle">ARCADE</span><button class="btn" id="wclose" type="button">CLOSE [ESC]</button></div>
    <div class="wbody" id="wbody"></div>
  </div>
</div>

<noscript>This page is a small JavaScript game. Visit ash-philip.github.io for the regular version.</noscript>

<script>
(()=>{
'use strict';

/* ---------- constants ---------- */
const T=16, W=24, H=16, STEP=135;
const C={
  ground:'#17133a', ground2:'#1c1745', tuft:'#2a8f8a',
  pathA:'#3b3475', pathD:'#2b2662', pathEdge:'#8b6bff',
  treeD:'#0b4a52', treeM:'#117672', treeL:'#25c9b5', trunk:'#4a2d4f',
  water:'#1a3591', waterL:'#3d7bff', shore:'#0d1a52',
  purple:'#9b6dff', cyan:'#3df5e0', pink:'#ff4fa3', gold:'#ffd23f'
};
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- content ---------- */
const PROJECTS=[
  {name:'TaskFlow Growth Analytics',feat:true,tags:'Experimentation · Causal Inference · ML',
   desc:'An end-to-end growth analytics case study on a simulated B2B SaaS company: funnel and retention analysis, A/B testing, causal inference, churn modeling, and customer lifetime estimation. Because the data is synthetic, the true answer is known, so the project checks whether standard methods recover the truth.',
   stack:['Python','BigQuery','dbt','statsmodels','lifelines','Streamlit'],
   links:[['Live app','https://taskflow-growth-analytics.streamlit.app'],['GitHub','https://github.com/ash-philip/taskflow-growth-analytics']]},
  {name:'Transit & Rideshare Analysis',tags:'Time-Series Forecasting · Data Engineering · BI',
   desc:'A synthetic-data rebuild of a ridership and revenue forecasting problem from a Pierce Transit consulting engagement. Built the pipeline, trained SARIMAX models for boardings, revenue, and farebox recovery, and deployed a Streamlit app for fare-change scenarios.',
   stack:['Python','Azure SQL','statsmodels','Streamlit'],
   links:[['Live app','https://transit-rideshare-analysis.streamlit.app'],['GitHub','https://github.com/ash-philip/Transit-Rideshare-Analysis']]},
  {name:'E-Commerce Database Analytics',tags:'SQL · Data Modeling · Business Analysis',
   desc:'A relational database project that turns raw e-commerce records into a cloud data warehouse. The schema is designed in Azure SQL, with exploratory analysis in Python and pandas. Covers RFM segmentation, cohort retention, and customer lifetime value.',

const SECTIONS={
  about:()=>`<h2>About</h2>
    <p>Hi, I am Ashwin. I am a <b>Data Professional</b> with a background in telecommunications engineering and a Master of Science in Business Analytics from the University of Washington.</p>
    <p>My engineering background taught me to break down complex systems and understand how things operate. I approach data analysis the same way. My focus is entirely on finding the ground truth and translating a complicated web of information into clear, actionable business strategy.</p>
    <blockquote>At the end of every data point is a human behavior.</blockquote>
    <p>My perspective is heavily shaped by the places I have lived. I grew up in Dubai and later spent time in Sydney, where I briefly worked as a gelato maker (shoutout to Rivareno). Experiencing such vibrant, international hubs gave me a deep appreciation for different cultures, global perspectives, and the way people connect. This inherent curiosity about people makes me a better analyst.</p>`,

    </div>`,
  beyond:()=>`<h2>Beyond the data</h2>

function pxsvg(rows){
  let r='';
  rows.forEach((row,y)=>{for(let x=0;x<row.length;x++)if(row[x]==='#')r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`});
  return `<svg viewBox="0 0 8 8" width="22" height="22" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${r}</svg>`;
}

function bake(){
  const rnd=lcg(11);
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const x=c*T,y=r*T;
    rect(b,x,y,T,T,((c+r)&1)?C.ground2:C.ground);
    for(let i=0;i<3;i++)if(rnd()<.55){const tx=x+(rnd()*13|0),ty=y+(rnd()*12|0);rect(b,tx,ty+1,1,2,C.tuft);rect(b,tx+1,ty,1,3,C.tuft);rect(b,tx+2,ty+1,1,2,C.tuft)}
    if(rnd()<.07){const fc=[C.pink,C.gold,C.cyan,'#fff'][rnd()*4|0];const fx=x+3+(rnd()*9|0),fy=y+3+(rnd()*9|0);rect(b,fx,fy,2,2,fc);rect(b,fx,fy+2,1,1,C.tuft)}
  }
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const x=c*T,y=r*T;
    if(path[r][c]){
      rect(b,x,y,T,T,C.pathA);
      rect(b,x,y+7,T,1,C.pathD);rect(b,x,y+15,T,1,C.pathD);
      rect(b,x+(r%2?4:11),y,1,7,C.pathD);rect(b,x+(r%2?11:4),y+8,1,7,C.pathD);
      if(rnd()<.22)rect(b,x+(rnd()*14|0),y+(rnd()*14|0),1,1,C.pathEdge);
      if(r>0&&!path[r-1][c])rect(b,x,y,T,1,C.pathD);
      if(r<H-1&&!path[r+1][c])rect(b,x,y+15,T,1,'#1d1948');
    }
    if(water[r][c]){
      rect(b,x,y,T,T,C.water);
      for(let i=0;i<2;i++)rect(b,x+(rnd()*9|0)+1,y+(rnd()*13|0)+1,4,1,C.waterL);
      if(r>0&&!water[r-1][c])rect(b,x,y,T,2,C.shore);
      if(r<H-1&&!water[r+1][c])rect(b,x,y+14,T,2,C.shore);

    }

  rect(b,19*T+4,12*T+5,5,3,'#1f9d55');rect(b,19*T+7,12*T+5,2,2,C.pink);

/* ---------- fireworks and banner ---------- */
const FX={on:false,t:0,sched:[],rockets:[],parts:[]};
const FW=['#ff3b4a','#ffffff','#ffd23f','#3df5e0','#ff4fa3'];
const FX_DUR=4200;
function fireworks(){
  FX.on=true;FX.t=0;FX.rockets=[];FX.parts=[];
  FX.sched=reduce?[]:[0,300,650,1000,1400,1800,2250,2700].map(t=>({t,done:false}));
  sfx.cheer();
}
function launchRocket(){
  const tx=225+Math.random()*135,ty=60+Math.random()*90;
  FX.rockets.push({x0:346,y0:188,x:346,y:188,tx,ty,t:0,dur:420+Math.random()*160,col:FW[Math.random()*FW.length|0],done:false});
  sfx.whistle();
}
function burst(r){
  sfx.boom();
  const n=32+(Math.random()*12|0),c2=FW[Math.random()*FW.length|0];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+Math.random()*.2,s=30+Math.random()*32;
    FX.parts.push({x:r.tx,y:r.ty,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:800+Math.random()*500,col:i%3?r.col:c2});
  }
}
function fxUpdate(dt){
  if(!FX.on)return;
  FX.t+=dt;
  FX.sched.forEach(s=>{if(!s.done&&FX.t>=s.t){s.done=true;launchRocket()}});
  for(const r of FX.rockets){
    r.t+=dt;const p=Math.min(1,r.t/r.dur);
    r.x=r.x0+(r.tx-r.x0)*p;r.y=r.y0+(r.ty-r.y0)*p;
    if(p>=1&&!r.done){r.done=true;burst(r)}
  }
  FX.rockets=FX.rockets.filter(r=>!r.done);
  const sec=dt/1000;
  for(const q of FX.parts){q.age+=dt;q.vy+=45*sec;q.vx*=1-1.1*sec;q.vy*=1-.6*sec;q.x+=q.vx*sec;q.y+=q.vy*sec}
  FX.parts=FX.parts.filter(q=>q.age<q.life);
  if(FX.t>FX_DUR&&!FX.parts.length&&!FX.rockets.length)FX.on=false;
}
function drawFX(){
  if(!FX.on)return;
  for(const r of FX.rockets){
    const x=Math.round(r.x),y=Math.round(r.y);
    rect(g,x,y,2,2,'#fff');rect(g,x,y+3,1,3,'#ffd23f');rect(g,x,y+7,1,2,'#e11d2e');
  }
  for(const q of FX.parts){
    const f=q.age/q.life;
    if(f>.6&&((q.age/60|0)&1))continue;
    g.globalAlpha=f>.6?1-(f-.6)/.4:1;
    rect(g,Math.round(q.x),Math.round(q.y),2,2,q.col);
  }
  g.globalAlpha=1;
}
function drawBanner(){
  if(!FX.on)return;
  const a=Math.min(1,FX.t/200,(FX_DUR-FX.t)/300);
  if(a<=0)return;
  const fs=VW<300?8:16,pd=fs*.75,bh=fs*2.25,tb=Math.round(fs*.5),bt=fs/8;

  rect(g,x-pd,y-tb,bt,bh,bc);rect(g,x+tw+pd-bt,y-tb,bt,bh,bc);

}

/* ---------- audio ---------- */
let ac=null,muted=false;
try{muted=localStorage.getItem('ow-muted')==='1'}catch(e){}
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}
  return ac;
}
function tone(f,d,type,v,t0,slide){
  if(muted)return;const a=audio();if(!a)return;
  const t=a.currentTime+(t0||0),o=a.createOscillator(),gn=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  gn.gain.setValueAtTime(v||.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={
  start(){[523,659,784,1046].forEach((f,i)=>tone(f,.11,'square',.05,i*.08))},
  coin(){tone(988,.07,'square',.05);tone(1319,.2,'square',.05,.07)},
  door(){[392,523,659,784].forEach((f,i)=>tone(f,.09,'triangle',.08,i*.06))},
  bump(){tone(120,.06,'square',.04)},
  blip(){tone(680,.03,'square',.02)},
  back(){tone(330,.08,'square',.05);tone(247,.12,'square',.05,.07)},
  win(){[523,659,784,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.05,i*.09))},
  cheer(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.1,'square',.05,i*.07))},
  whistle(){tone(420,.4,'sine',.03,0,1500)},
  boom(){tone(150,.25,'square',.05,0,45);tone(1700+Math.random()*900,.05,'square',.02,.05);tone(1400+Math.random()*900,.05,'square',.02,.12)}
};

/* ---------- state ---------- */
let state='title', prevState='title', doorKey=null;
const held=[];
const P={c:11,r:8,dir:'up',moving:false,t:0,fc:11,fr:8,tc:11,tr:8,leg:0};
let got=0, bumpAt=0, treeSeen=false, treeTimers=[];

const free=(c,r)=>c>=0&&r>=0&&c<W&&r<H&&!solid[r][c];

function heldDir(){return held.length?held[held.length-1]:null}
function tryMove(){
  const d=heldDir();if(!d)return;
  P.dir=d;const [dx,dy]=DIRS[d],nc=P.c+dx,nr=P.r+dy;
  if(free(nc,nr)){P.moving=true;P.t=0;P.fc=P.c;P.fr=P.r;P.tc=nc;P.tr=nr}
  else if(talk[nc+','+nr]==='tree'){openPanel('skills',null)}
  else{const n=performance.now();if(n-bumpAt>260){bumpAt=n;sfx.bump()}}
}
function finishStep(){
  P.c=P.tc;P.r=P.tr;P.moving=false;P.t=0;P.leg^=1;
  for(const k of coins){
    if(!k.got&&k.c===P.c&&k.r===P.r){
      k.got=true;got++;sfx.coin();
      $('#score').textContent=got+'/'+coins.length;
      if(got===coins.length){$('#scoreWrap').classList.add('done');setTimeout(()=>{sfx.win();say(TALK.all)},250)}
    }
  }
  const id=doors[P.c+','+P.r];
  if(id)openPanel(id,P.c+','+P.r);
}
function update(dt){
  if(state!=='play')return;
  if(P.moving){P.t+=dt;if(P.t>=STEP)finishStep()}
  if(!P.moving&&state==='play')tryMove();
}

/* ---------- drawing ---------- */
function draw(ts){
  let x=P.c*T,y=P.r*T,walking=false;
  if(P.moving){
    const p=Math.min(1,P.t/STEP);x=(P.fc+(P.tc-P.fc)*p)*T;y=(P.fr+(P.tr-P.fr)*p)*T;walking=true;
    if(p>.2&&p<.8)y-=1;
  }
  const tg=camTarget(x,y);cam.x+=(tg.x-cam.x)*.2;cam.y+=(tg.y-cam.y)*.2;
  g.save();g.translate(-Math.round(cam.x),-Math.round(cam.y));
  g.drawImage(bg,0,0);
  // door arrows
  const bob=Math.round(Math.sin(ts/220)*2);
  BUILDINGS.forEach(bd=>{
    const cx=(bd.doors[0]+bd.doors.length/2)*T;
    drawArrow(cx,(bd.y+3)*T-13+bob,bd.neon);
  });
  // data points
  coins.forEach((k,i)=>{
    if(k.got)return;
    const x=k.c*T+8,y=k.r*T+8+Math.round(Math.sin(ts/260+i)*1.5);
    g.globalAlpha=.16+.08*Math.sin(ts/300+i);rect(g,x-7,y-7,14,14,C.cyan);g.globalAlpha=1;
    rect(g,x-1,y-5,2,2,'#fff');rect(g,x-3,y-3,6,2,C.cyan);rect(g,x-5,y-1,10,2,C.cyan);rect(g,x-3,y+1,6,2,C.cyan);rect(g,x-1,y+3,2,2,'#1aa8a0');
    rect(g,x-2,y-2,2,1,'#fff');
  });
  drawNPC(ts);drawFlag(ts);drawSkillTree(ts);
  drawPlayer(Math.round(x),Math.round(y),P.dir,walking,P.leg);
  drawFX();
  g.restore();
  drawBanner();
}
let last=0;
function frame(ts){
  const dt=Math.min(50,ts-last);last=ts;
  update(dt);fxUpdate(dt);draw(ts);
  requestAnimationFrame(frame);
}

/* ---------- dialogue ---------- */
const dlgEl=$('#dialog'),dText=$('#dtext'),dSr=$('#dsr');
const dlg={lines:[],i:0,full:'',pos:0,typing:false,timer:0};
function showLine(){
  dlg.full=dlg.lines[dlg.i];dlg.pos=0;clearInterval(dlg.timer);
  dSr.textContent=dlg.full;
  if(reduce){dText.textContent=dlg.full;dlg.typing=false;return}
  dText.textContent='';dlg.typing=true;
  dlg.timer=setInterval(()=>{
    dlg.pos++;dText.textContent=dlg.full.slice(0,dlg.pos);
    if(dlg.pos%3===0)sfx.blip();
    if(dlg.pos>=dlg.full.length){clearInterval(dlg.timer);dlg.typing=false}
  },26);
}
function say(lines){
  if(state==='panel')return;
  held.length=0;state='dialog';dlg.lines=lines;dlg.i=0;dlgEl.hidden=false;showLine();
}
function advance(){
  if(dlg.typing){clearInterval(dlg.timer);dText.textContent=dlg.full;dlg.typing=false;return}
  dlg.i++;if(dlg.i>=dlg.lines.length)closeDialog();else showLine();
}
function closeDialog(){clearInterval(dlg.timer);dlg.typing=false;dlgEl.hidden=true;state='play'}

/* ---------- panels ---------- */
const overlay=$('#overlay'),wbody=$('#wbody'),wtitle=$('#wtitle'),wclose=$('#wclose'),winEl=$('#win');
function clearTree(){treeTimers.forEach(clearTimeout);treeTimers=[]}
function playTree(){
  clearTree();
  const nodes=[...wbody.querySelectorAll('.tree [data-u]')];
  const cnt=wbody.querySelector('#tcount');
  const total=wbody.querySelectorAll('.skill').length;
  if(treeSeen||reduce){nodes.forEach(n=>n.classList.add('on'));cnt.textContent=total;treeSeen=true;return}
  treeSeen=true;let k=0;
  nodes.forEach((n,i)=>{
    treeTimers.push(setTimeout(()=>{
      n.classList.add('on');
      if(n.classList.contains('skill')){k++;cnt.textContent=k;tone(520+k*26,.05,'square',.03)}
      else tone(330,.09,'triangle',.05);
      if(i===nodes.length-1)sfx.win();
    },300+i*75));
  });
}
function openPanel(id,key){
  prevState=state==='panel'?prevState:state;
  held.length=0;doorKey=key||null;state='panel';
  if(key)sfx.door();
  wtitle.textContent=PANEL_TITLE[id];
  wbody.innerHTML=id==='plain'?['about','work','skillsPlain','beyond','contact'].map(k=>SECTIONS[k]()).join('<hr>'):SECTIONS[id]();
  winEl.classList.toggle('wide',id==='skills');
  wbody.scrollTop=0;overlay.hidden=false;wclose.focus({preventScroll:true});
  if(id==='skills')playTree();
}
function closePanel(){
  if(state!=='panel')return;
  overlay.hidden=true;state=prevState;sfx.back();clearTree();winEl.classList.remove('wide');
  if(doorKey&&state==='play'){const [c,r]=doorKey.split(',').map(Number);P.c=c;P.r=r+1;P.dir='down';P.moving=false}
  doorKey=null;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
}
wclose.addEventListener('click',closePanel);
overlay.addEventListener('click',e=>{if(e.target===overlay)closePanel()});
/* Resume download: on a normal site a plain download link; inside the artifact viewer the downloads capability */
wbody.addEventListener('click',async e=>{
  const btn=e.target.closest('[data-dl]');if(!btn)return;
  const msg=wbody.querySelector('#dlmsg');
  const note=t=>{if(msg)msg.textContent=t};
  const FILE='Ashwin_Philip_Resume.pdf';
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){
      const a=document.createElement('a');a.href='resume.pdf';a.download=FILE;
      document.body.appendChild(a);a.click();a.remove();note('Download started.');return;
    }
    note('Preparing the file...');
    const r=await fetch('resume.pdf');if(!r.ok)throw new Error('fetch');
    await dl.save({filename:FILE,data:await r.blob()});
    note('Saved.');
  }catch(err){
    note(err&&err.code==='declined'?'':'The download did not start. Try again in a moment.');
  }
});
wbody.addEventListener('click',e=>{
  const btn=e.target.closest('[data-copy]');if(!btn)return;
  const fallback=()=>{
    const el=document.getElementById('mail');
    if(el){const rg=document.createRange();rg.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(rg)}
    btn.textContent='SELECTED';
  };
  try{navigator.clipboard.writeText(btn.dataset.copy).then(()=>{btn.textContent='COPIED'},fallback)}catch(err){fallback()}
});

/* ---------- input ---------- */
function interact(){
  if(P.moving)return;
  const [dx,dy]=DIRS[P.dir],k=(P.c+dx)+','+(P.r+dy);
  if(talk[k]==='tree'){held.length=0;openPanel('skills',null)}
  else if(talk[k]){held.length=0;if(talk[k]==='flag')fireworks();say(TALK[talk[k]])}
  else if(doors[k])openPanel(doors[k],k)
}
function act(){if(state==='dialog')advance();else if(state==='play')interact()}
function back(){if(state==='panel')closePanel();else if(state==='dialog')closeDialog()}
function startGame(){
  if(state!=='title')return;
  audio();sfx.start();$('#title').hidden=true;state='play';
  setTimeout(()=>say(TALK.intro),350);
}
const KEYDIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(state==='panel'){if(k==='Escape'){e.preventDefault();closePanel()}return}
  if(state==='title'){
    if((k==='Enter'||k===' ')&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){e.preventDefault();startGame()}
    return;
  }
  if(KEYDIR[k]&&state==='play'){e.preventDefault();const d=KEYDIR[k];if(!held.includes(d))held.push(d);return}
  if(k==='Enter'||k===' '||k==='e'||k==='E'||k==='z'||k==='Z'){e.preventDefault();if(!e.repeat)act();return}
  if(k==='Escape'||k==='x'||k==='X'||k==='Backspace'){e.preventDefault();back()}
});
addEventListener('keyup',e=>{const d=KEYDIR[e.key];if(d){const i=held.indexOf(d);if(i>-1)held.splice(i,1)}});
addEventListener('blur',()=>{held.length=0});

document.querySelectorAll('.pb[data-dir]').forEach(btn=>{
  const d=btn.dataset.dir;
  const press=e=>{e.preventDefault();if(state!=='play')return;btn.classList.add('on');if(!held.includes(d))held.push(d)};
  const rel=()=>{btn.classList.remove('on');const i=held.indexOf(d);if(i>-1)held.splice(i,1)};
  btn.addEventListener('pointerdown',press);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,rel));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});
$('#aBtn').addEventListener('click',()=>{if(state==='title')startGame();else act()});
$('#bBtn').addEventListener('click',back);
$('#start').addEventListener('click',startGame);
$('#skip').addEventListener('click',()=>openPanel('plain'));
$('#resume').addEventListener('click',e=>{
  e.currentTarget.blur();
  if(state==='panel')return;
  if(state==='dialog')closeDialog();
  openPanel('resume');
});
$('#plain').addEventListener('click',e=>{e.currentTarget.blur();if(state!=='panel')openPanel('plain')});
const sndBtn=$('#snd');
function paintSnd(){sndBtn.textContent=muted?'SOUND OFF':'SOUND ON';sndBtn.setAttribute('aria-pressed',muted?'true':'false')}
sndBtn.addEventListener('click',e=>{
  muted=!muted;try{localStorage.setItem('ow-muted',muted?'1':'0')}catch(err){}
  paintSnd();if(!muted){audio();sfx.blip()}e.currentTarget.blur();
});
paintSnd();

/* click or tap near the flag */
const cvEl=$('#cv');
function hitSpot(e){
  const r=cvEl.getBoundingClientRect();
  const x=cam.x+(e.clientX-r.left)/r.width*VW,y=cam.y+(e.clientY-r.top)/r.height*VH;
  if(x>=332&&x<=372&&y>=156&&y<=194)return 'tree';
  if(x>=316&&x<=358&&y>=194&&y<=228)return 'flag';
  return null;
}
cvEl.addEventListener('click',e=>{
  if(state!=='play')return;
  const h=hitSpot(e);
  if(h==='flag'){held.length=0;fireworks();say(TALK.flag)}
  else if(h==='tree'){held.length=0;openPanel('skills',null)}
});
cvEl.addEventListener('pointermove',e=>{cvEl.style.cursor=(state==='play'&&hitSpot(e))?'pointer':''});

/* ---------- boot ---------- */
(async()=>{
  try{await Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  bake();applyMode();
  try{mqZoom.addEventListener('change',applyMode)}catch(e){try{mqZoom.addListener(applyMode)}catch(e2){}}
  requestAnimationFrame(frame);
  try{$('#start').focus({preventScroll:true})}catch(e){}
})();
})();
</script>
</body>
